<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis finanzas</title>
<meta name="theme-color" content="#FBFAF7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1D1C19" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png?v=3">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=3">
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600&display=swap">
<style>
  :root { --bg: #FBFAF7; --ink: #1F1E1B; --muted: #6F6C64; --track: #E4E1D8; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1D1C19; --ink: #ECEAE3; --muted: #A19E94; --track: #3A3832; color-scheme: dark; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  .splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; transition: opacity .35s ease; }
  .splash img { width: 96px; height: 96px; border-radius: 22px; }
  .splash h1 { margin: 0; font-family: "Source Serif 4", Georgia, serif; font-weight: 600; font-size: 24px; letter-spacing: -0.01em; }
  .barra { width: 120px; height: 3px; border-radius: 2px; background: var(--track); overflow: hidden; }
  .barra i { display: block; width: 40%; height: 100%; border-radius: 2px; background: var(--ink); animation: ir 1.1s ease-in-out infinite; }
  @keyframes ir { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
  @media (prefers-reduced-motion: reduce) { .barra i { animation: none; width: 100%; opacity: .35; } }
  .ayuda { position: fixed; left: 24px; right: 24px; bottom: calc(32px + env(safe-area-inset-bottom, 0px)); text-align: center; font-size: 14px; color: var(--muted); opacity: 0; transition: opacity .4s ease; }
  .ayuda.ver { opacity: 1; }
  .ayuda a { color: var(--ink); font-weight: 600; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; opacity: 0; transition: opacity .35s ease; padding-top: env(safe-area-inset-top, 0px); box-sizing: border-box; background: var(--bg); }
  body.lista iframe { opacity: 1; }
  body.lista .splash, body.lista .ayuda { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<!-- Esta página no contiene datos. Solo abre la app privada de Google, que pide la cuenta de su dueño. -->
<div class="splash" aria-live="polite">
  <img src="icons/icon-192.png?v=3" alt="">
  <h1>Mis finanzas</h1>
  <div class="barra" role="progressbar" aria-label="Cargando"><i></i></div>
</div>
<p class="ayuda" id="ayuda">¿No carga? Comprueba que tienes abierta tu cuenta de Google en Chrome o <a id="directo" href="#" target="_blank" rel="noopener">ábrela en Chrome</a>.</p>
<iframe id="app" title="Mis finanzas" allow="clipboard-write"></iframe>
<script>
  var APP = "https://script.google.com/macros/s/AKfycbytjaeucvt-QBqHbtm61svJbj9_GzWaxxXpDniGMi5VPxuz8S77Jn3YMcpoqRlMuqA7JQ/exec";
  var app = document.getElementById("app");
  document.getElementById("directo").href = APP;
  var ayuda = setTimeout(function () { document.getElementById("ayuda").classList.add("ver"); }, 15000);
  app.addEventListener("load", function () {
    clearTimeout(ayuda);
    // Google carga la app en dos pasos; se espera un momento para no enseñar la página a medias.
    setTimeout(function () { document.body.classList.add("lista"); }, 700);
  });
  app.src = APP;
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});
</script>
</body>
</html>
